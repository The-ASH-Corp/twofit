version: "3.9"

services:
  app:
    build: .
    container_name: twofit_app
    ports:
      - "5000:5000"
      - "5173:5173"
    env_file:
      - ./Backend/.env
      - ./admindashboard/.env
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: redis
    command: redis-server --requirepass newRedisPassword
    ports:
      - "6379:6379"

volumes:
  mongo_data:
